[tool.poetry]
name = "axiom-core"
version = "0.10.0"
description = "Core domain and application rules for Axiom Productivity."
authors = ["Wesley Francisco de Lima <wesleyfralima@gmail.com>"]
readme = "README.md"
license = "LicenseRef-Axiom-Core-1.0"

packages = [
    { include = "a_core" },
    { include = "b_domain" },
    { include = "c_application" },
]

[tool.poetry.dependencies]
python = ">=3.12,<3.15"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-asyncio = "^0.23.0"
mypy = "^1.8.0"
ruff = "^0.15.20"
pre-commit = "^4.6.0"
pytest-cov = "^7.1.0"
coverage = "^7.14.3"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.coverage.report]
# Floor = real coverage, so `make check` is green; raise it whenever tests are added.
fail_under = 75.5
precision = 1
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "@abstractmethod",
    "@abc.abstractmethod"
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF"]

[tool.ruff.lint.flake8-bugbear]
# frozen value objects: safe as argument defaults
extend-immutable-calls = ["b_domain.value_objects.Description"]

[tool.mypy]
mypy_path = ["."]
# d_fake_infra/ is local (gitignored) and not part of the project
files = ["a_core", "b_domain", "c_application", "tests"]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
markers = """
    unit: unit tests (fast, no I/O, no external dependencies)
    integration: integration tests
    system: end-to-end tests
    uc: use cases tests
"""
